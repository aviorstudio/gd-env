name: Release
'on':
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        required: true
        type: choice
        options:
        - patch
        - minor
        - major
      retry-tag:
        description: Existing exact tag to republish without rebuilding (normally empty)
        required: false
        type: string
      retry-sha256:
        description: Required existing release asset SHA-256 when retry-tag is set
        required: false
        type: string
permissions:
  contents: read
concurrency: release-${{ github.repository }}
jobs:
  test:
    name: Test package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      retry: ${{ steps.release.outputs.retry }}
      target: ${{ steps.release.outputs.target }}
    steps:
    - name: Check out source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - name: Set up locked komizo
      uses: nicodes/komizo/setup@1b740f28682948a2d5eb4613744bb262d2056e6c
      env:
        GH_TOKEN: ${{ github.token }}
      timeout-minutes: 5
    - name: Determine release version
      id: release
      env:
        BUMP: ${{ inputs.bump }}
        RETRY_TAG: ${{ inputs['retry-tag'] }}
        RETRY_SHA256: ${{ inputs['retry-sha256'] }}
      run: |
        set -euo pipefail
        test "$GITHUB_REF" = refs/heads/main
        git fetch --tags --force
        if [ -n "$RETRY_TAG" ]; then
          [[ "$RETRY_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$RETRY_SHA256" =~ ^[0-9a-f]{64}$ ]]
          target="$(git rev-list -n 1 "$RETRY_TAG")"
          test -n "$target"
          version="${RETRY_TAG#v}"
          plugin_version="$(sed -n -E 's/^version="([^"]+)"/\1/p' addon/plugin.cfg | head -n 1)"
          test "$plugin_version" = "$version"
          {
            echo "version=$version"
            echo "tag=$RETRY_TAG"
            echo "retry=true"
            echo "target=$target"
          } >>"$GITHUB_OUTPUT"
          exit 0
        fi
        latest="$(git tag --list 'v[0-9]*' | sed -E 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
        if [ -z "$latest" ]; then
          version=0.0.1
        else
          IFS=. read -r major minor patch <<<"$latest"
          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
            *) echo "Unsupported bump: $BUMP" >&2; exit 1 ;;
          esac
          version="$major.$minor.$patch"
        fi
        tag="v$version"
        if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
          echo "Refusing duplicate release tag: $tag" >&2
          exit 1
        fi
        plugin_version="$(sed -n -E 's/^version="([^"]+)"/\1/p' addon/plugin.cfg | head -n 1)"
        test "$plugin_version" = "$version"
        {
          echo "version=$version"
          echo "tag=$tag"
          echo "retry=false"
          echo "target=$GITHUB_SHA"
        } >>"$GITHUB_OUTPUT"
    - name: Check project
      if: steps.release.outputs.retry != 'true'
      uses: nicodes/komizo/run@1b740f28682948a2d5eb4613744bb262d2056e6c
      with:
        target: check
    - name: Recover existing immutable release package
      if: steps.release.outputs.retry == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ steps.release.outputs.tag }}
        EXPECTED_SHA256: ${{ inputs['retry-sha256'] }}
        TARGET: ${{ steps.release.outputs.target }}
      run: |
        set -euo pipefail
        release_target="$(gh release view "$TAG" --json targetCommitish --jq .targetCommitish)"
        test "$release_target" = "$TARGET"
        mkdir -p dist
        gh release download "$TAG" --pattern '@aviorstudio_gd-env.zip' --dir dist
        printf '%s  %s\n' "$EXPECTED_SHA256" '@aviorstudio_gd-env.zip' >'dist/@aviorstudio_gd-env.zip.sha256'
        ./scripts/verify_package_checksum.sh
        api_digest="$(gh release view "$TAG" --json assets --jq '.assets[] | select(.name=="@aviorstudio_gd-env.zip") | .digest')"
        test "$api_digest" = "sha256:$EXPECTED_SHA256"
        echo "REACHED gd-env release_recovery assertions=4"
    - name: Upload artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: release-package-${{ github.sha }}
        path: |
          dist/@aviorstudio_gd-env.zip
          dist/@aviorstudio_gd-env.zip.sha256
        if-no-files-found: error
    permissions:
      contents: read
      attestations: read
    env:
      MISE_GITHUB_TOKEN: ${{ github.token }}
  publish:
    name: Publish release
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
    - name: Check out source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Download artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: release-package-${{ github.sha }}
        path: dist
    - name: Verify downloaded package identity
      run: ./scripts/verify_package_checksum.sh
    - name: Create GitHub Release
      if: needs.test.outputs.retry != 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ needs.test.outputs.tag }}
      run: gh release create "$TAG" 'dist/@aviorstudio_gd-env.zip' --target "$GITHUB_SHA" --title "$TAG" --notes "Release $TAG"
    - name: Verify existing GitHub Release
      if: needs.test.outputs.retry == 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ needs.test.outputs.tag }}
        TARGET: ${{ needs.test.outputs.target }}
        EXPECTED_SHA256: ${{ inputs['retry-sha256'] }}
      run: |
        set -euo pipefail
        test "$(gh release view "$TAG" --json targetCommitish --jq .targetCommitish)" = "$TARGET"
        test "$(gh release view "$TAG" --json assets --jq '.assets[] | select(.name=="@aviorstudio_gd-env.zip") | .digest')" = "sha256:$EXPECTED_SHA256"
        echo "REACHED gd-env existing_release assertions=2"
    - name: Publish addon
      uses: aviorstudio/gdam-actions/publish@6677226d9353df1d410f3e7f5075e13b3b7d5308
      with:
        tag: ${{ needs.test.outputs.tag }}
        addon: '@aviorstudio/gd-env'
        asset: '@aviorstudio_gd-env.zip'
        api-key: ${{ secrets.GDAM_API_KEY }}
