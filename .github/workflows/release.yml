name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        required: true
        type: choice
        options: [patch, minor, major]

permissions:
  contents: read

concurrency: release-${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Determine release version
        id: release
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          git fetch --tags --force
          latest="$(git tag --list 'v[0-9]*' | sed -E 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
          if [ -z "$latest" ]; then
            version=0.0.1
          else
            IFS=. read -r major minor patch <<<"$latest"
            case "$BUMP" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
              *) echo "Unsupported bump: $BUMP" >&2; exit 1 ;;
            esac
            version="$major.$minor.$patch"
          fi
          tag="v$version"
          ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null
          plugin_version="$(sed -n -E 's/^version="([^"]+)"/\1/p' addon/plugin.cfg | head -n 1)"
          test "$plugin_version" = "$version"
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "tag=$tag" >>"$GITHUB_OUTPUT"

      - name: Test exact release commit and package
        uses: ./.github/actions/test

      - name: Upload exact tested package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-package-${{ github.sha }}
          path: |
            dist/@aviorstudio_gd-env.zip
            dist/@aviorstudio_gd-env.zip.sha256
          if-no-files-found: error

  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download exact tested package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-package-${{ github.sha }}
          path: dist

      - name: Verify downloaded package identity
        run: ./scripts/verify_package_checksum.sh

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.test.outputs.tag }}
        run: gh release create "$TAG" 'dist/@aviorstudio_gd-env.zip' --target "$GITHUB_SHA" --title "$TAG" --notes "Release $TAG"

      - name: Install checksum-verified GDAM v0.0.8
        id: install-gdam
        uses: aviorstudio/gdam-actions/install@d735444eb470194585def44521d5d91df2260e63 # v0.0.2
        with:
          version: 'v0.0.8'

      - name: Verify GDAM version
        env:
          INSTALLED_VERSION: ${{ steps.install-gdam.outputs.version }}
        run: |
          case "$INSTALLED_VERSION" in
            *0.0.8*) printf '%s\n' "$INSTALLED_VERSION" ;;
            *) echo "Unexpected GDAM version: $INSTALLED_VERSION" >&2; exit 1 ;;
          esac

      - name: Publish exact GitHub asset to GDAM
        uses: aviorstudio/gdam-actions/publish@d735444eb470194585def44521d5d91df2260e63 # v0.0.2
        with:
          tag: ${{ needs.test.outputs.tag }}
          addon: '@aviorstudio/gd-env'
          asset: '@aviorstudio_gd-env.zip'
          secret-key: ${{ secrets.GDAM_SECRET_KEY }}
